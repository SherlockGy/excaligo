name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'macOS'
        run: node scripts/build.mjs --ci --package
      - if: runner.os == 'Windows'
        run: node scripts/build.mjs --ci
      - run: go vet ./...
      - run: go test -race '-coverprofile=coverage.out' ./...
      - run: npm --prefix frontend run test:run
      - run: node --test scripts/release-config.test.mjs
      - run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: excaligo-${{ matrix.os }}
          path: bin/release/*
          if-no-files-found: error
