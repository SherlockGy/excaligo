name: CI
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'macOS'
        run: node scripts/build.mjs --ci --package
      - if: runner.os == 'Windows'
        run: node scripts/build.mjs --ci
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: npm --prefix frontend run test:run
      - if: runner.os == 'macOS'
        run: tar -czf bin/Excaligo-macos.tar.gz -C bin Excaligo.app
      - uses: actions/upload-artifact@v4
        with:
          name: excaligo-${{ runner.os }}
          path: |
            bin/Excaligo-macos.tar.gz
            bin/excaligo.exe
